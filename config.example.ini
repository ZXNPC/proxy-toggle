; ============================================================
; ProxyToggle 配置文件示例
;
; 使用方式（二选一）:
;   1. 首次运行脚本/程序时，会自动生成 config.ini（无需手动创建）
;   2. 手动把本文件复制为 config.ini 后按需修改
;
; 注意: config.ini 必须与 ProxyToggle.exe（或 ProxyToggle.ahk）
;       放在同一目录；修改后重启脚本（或通过设置窗口修改）生效。
; ============================================================

[General]
; 代理服务器地址，原样写入 Windows 注册表 ProxyServer
; 支持 "host:port"（HTTP 代理），也支持 "socks=host:port"（SOCKS 代理）
ProxyAddr=192.168.31.110:7890

; 切换快捷键（AutoHotkey v2 语法）
;   ^ = Ctrl    ! = Alt    + = Shift    # = Win
;   示例: ^!p  => Ctrl+Alt+P
;         ^+p  => Ctrl+Shift+P
Hotkey=^!p

[Indicator]
; 是否显示代理状态提示（1=显示，0=关闭）
Show=1
; 提示窗口透明度（0~255，255 为不透明）
Transparency=180
; 提示文字字号
FontSize=16
; 提示窗口宽度
Width=200
; 提示窗口高度
Height=60

[Startup]
; 是否开机启动（1=是，0=否）
; 也可以在托盘菜单或设置窗口中直接切换
AutoStart=0
