name: Build ProxyToggle

# 触发条件:
#   - 推送到 main 分支（自动构建，验证脚本可编译）
#   - 推送 v* 标签（构建并发布 GitHub Release）
#   - PR（仅构建验证）
#   - 手动触发（Actions 页面点 Run workflow）
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Ahk2Exe (AutoHotkey compiler)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'Ahk2Exe.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'Ahk2Exe'
          # 注意: 最新版 Ahk2Exe(1.1.37) 已支持编译 v1.1 和 v2+ 脚本；
          # 资产名不固定(如 Ahk2Exe1.1.37.02a2.zip)，通过 API 动态获取
          $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest' -Headers @{ 'User-Agent' = 'proxy-toggle-build' }
          $asset = $rel.assets | Where-Object { $_.name -match '\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "latest release ($($rel.tag_name)) 中未找到 zip 资产" }
          Write-Host "Ahk2Exe: tag=$($rel.tag_name) asset=$($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir
          $exe = Get-ChildItem $dir -Recurse -Filter 'Ahk2Exe.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw '未找到 Ahk2Exe.exe' }
          Write-Host "Ahk2Exe: $($exe.FullName)"
          echo "AHK2EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Locate AutoHotkey v2 runtime (base file)
        shell: pwsh
        run: |
          $base = Get-ChildItem (Split-Path $env:AHK2EXE) -Recurse -Filter 'AutoHotkey64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $base) {
            Write-Host 'Ahk2Exe 中未找到运行时，下载 AutoHotkey v2 ...'
            $zip = Join-Path $env:RUNNER_TEMP 'ahk-v2.zip'
            $dir = Join-Path $env:RUNNER_TEMP 'AutoHotkey'
            Invoke-WebRequest -Uri 'https://www.autohotkey.com/download/ahk-v2.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir
            $base = Get-ChildItem $dir -Recurse -Filter 'AutoHotkey64.exe' | Select-Object -First 1
          }
          if (-not $base) { throw '未找到 AutoHotkey64.exe' }
          Write-Host "Base: $($base.FullName)"
          echo "AHK_BASE=$($base.FullName)" >> $env:GITHUB_ENV

      - name: Read version from script
        shell: pwsh
        run: |
          $m = Select-String -Path 'src/ProxyToggle.ahk' -Pattern 'AppVersion\s*:=\s*"([^"]+)"'
          if (-not $m) { throw '无法在 src/ProxyToggle.ahk 中找到 AppVersion' }
          $v = $m.Matches[0].Groups[1].Value
          Write-Host "Version: $v"
          echo "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Compile with Ahk2Exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'dist' | Out-Null
          # 用 cmd /c 调用并手动加引号：Ahk2Exe 是 GUI 程序(PowerShell 的 & 不等待)，
          # 且路径可能含空格(如 C:\Program Files)，参数必须显式加引号
          $cmdLine = '"{0}" /in "{1}" /out "{2}" /base "{3}" /compress 0 /silent' -f `
            $env:AHK2EXE, `
            (Join-Path $env:GITHUB_WORKSPACE 'src\ProxyToggle.ahk'), `
            (Join-Path $env:GITHUB_WORKSPACE "dist\ProxyToggle-$env:APP_VERSION.exe"), `
            $env:AHK_BASE
          $icon = Join-Path $env:GITHUB_WORKSPACE 'assets\app.ico'
          if (Test-Path $icon) { $cmdLine += ' /icon "' + $icon + '"' }
          cmd.exe /d /c $cmdLine
          if ($LASTEXITCODE -ne 0) { throw "Ahk2Exe 编译失败，退出码 $LASTEXITCODE" }
          $outFile = Join-Path $env:GITHUB_WORKSPACE "dist\ProxyToggle-$env:APP_VERSION.exe"
          if (-not (Test-Path $outFile)) { throw "编译产物不存在: $outFile" }
          Get-Item $outFile | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: ProxyToggle-${{ env.APP_VERSION }}
          path: dist/ProxyToggle-*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/ProxyToggle-*.exe
          generate_release_notes: true
