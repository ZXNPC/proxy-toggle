name: Build ProxyToggle

# 触发条件:
#   - 推送到 main 分支（自动构建，验证脚本可编译）
#   - 推送 v* 标签（构建并发布 GitHub Release）
#   - PR（仅构建验证）
#   - 手动触发（Actions 页面点 Run workflow）
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Ahk2Exe (AutoHotkey v2 compiler)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'Ahk2Exe.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'Ahk2Exe'
          Invoke-WebRequest -Uri 'https://github.com/AutoHotkey/Ahk2Exe/releases/latest/download/Ahk2Exe.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir
          $exe = Get-ChildItem $dir -Recurse -Filter 'Ahk2Exe.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw '未找到 Ahk2Exe.exe' }
          Write-Host "Ahk2Exe: $($exe.FullName)"
          echo "AHK2EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Locate AutoHotkey v2 runtime (base file)
        shell: pwsh
        run: |
          $base = Get-ChildItem (Split-Path $env:AHK2EXE) -Recurse -Filter 'AutoHotkey64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $base) {
            Write-Host 'Ahk2Exe 中未找到运行时，下载 AutoHotkey v2 ...'
            $zip = Join-Path $env:RUNNER_TEMP 'ahk-v2.zip'
            $dir = Join-Path $env:RUNNER_TEMP 'AutoHotkey'
            Invoke-WebRequest -Uri 'https://www.autohotkey.com/download/ahk-v2.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir
            $base = Get-ChildItem $dir -Recurse -Filter 'AutoHotkey64.exe' | Select-Object -First 1
          }
          if (-not $base) { throw '未找到 AutoHotkey64.exe' }
          Write-Host "Base: $($base.FullName)"
          echo "AHK_BASE=$($base.FullName)" >> $env:GITHUB_ENV

      - name: Read version from script
        shell: pwsh
        run: |
          $m = Select-String -Path 'src/ProxyToggle.ahk' -Pattern 'AppVersion\s*:=\s*"([^"]+)"'
          if (-not $m) { throw '无法在 src/ProxyToggle.ahk 中找到 AppVersion' }
          $v = $m.Matches[0].Groups[1].Value
          Write-Host "Version: $v"
          echo "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Compile with Ahk2Exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'dist' | Out-Null
          $ahkArgs = @(
            '/in', (Join-Path $env:GITHUB_WORKSPACE 'src\ProxyToggle.ahk'),
            '/out', (Join-Path $env:GITHUB_WORKSPACE "dist\ProxyToggle-$env:APP_VERSION.exe"),
            '/base', $env:AHK_BASE,
            '/compress', '0',
            '/silent'
          )
          $icon = Join-Path $env:GITHUB_WORKSPACE 'assets\app.ico'
          if (Test-Path $icon) { $ahkArgs += @('/icon', $icon) }
          & $env:AHK2EXE @ahkArgs
          if ($LASTEXITCODE -ne 0) { throw "Ahk2Exe 编译失败，退出码 $LASTEXITCODE" }
          Get-Item "dist\ProxyToggle-$env:APP_VERSION.exe" | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyToggle-${{ env.APP_VERSION }}
          path: dist/ProxyToggle-*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ProxyToggle-*.exe
          generate_release_notes: true
